<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Radar — Redefinir Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/views/reset-password-code.css">
</head>
<body>

  <main class="reset-code-page">

    <div class="reset-code-card">

      <header class="reset-code-card__header">
        <a class="reset-code-card__logo" href="../index.html">Goal Radar</a>
        <div class="reset-code-card__icon">
          <i data-lucide="shield-check"></i>
        </div>
        <h1 class="reset-code-card__title">Verifique seu email</h1>
        <p class="reset-code-card__subtitle">
          Enviamos um código de 6 dígitos para <strong>seu@email.com</strong>.
          Insira abaixo para continuar a redefinição da sua senha.
        </p>
      </header>

      <form class="reset-code-form">

        <div class="reset-code-form__inputs">
          <input class="reset-code-form__digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
          <input class="reset-code-form__digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
          <input class="reset-code-form__digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
          <input class="reset-code-form__digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
          <input class="reset-code-form__digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
          <input class="reset-code-form__digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
        </div>

        <button class="btn btn--primary btn--full btn--reset-code" type="submit">
          Verificar código
        </button>

      </form>

      <footer class="reset-code-card__footer">
        <p class="reset-code-card__resend">
          Não recebeu o código?
          <button class="reset-code-card__resend-btn" type="button">Reenviar</button>
        </p>
      </footer>

    </div>

  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/components/otp-input.js"></script>   <!-- primeiro -->
  <script src="../js/views/reset-password-code.js"></script>
</body>
</html>
