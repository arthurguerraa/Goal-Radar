<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Radar — Recuperar Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/views/forgot-password.css">
</head>
<body>

  <main class="forgot-page">

    <div class="forgot-card">

      <header class="forgot-card__header">
        <a class="forgot-card__logo" href="../index.html">Goal Radar</a>
        <div class="forgot-card__icon">
          <i data-lucide="lock-keyhole"></i>
        </div>
        <h1 class="forgot-card__title">Esqueceu sua senha?</h1>
        <p class="forgot-card__subtitle">
          Informe seu email e enviaremos um código para você redefinir sua senha.
        </p>
      </header>

      <form class="forgot-form">

        <div class="forgot-form__field">
          <label class="forgot-form__label" for="email">Email</label>
          <input
            class="forgot-form__input"
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="email"
          />
        </div>

        <button class="btn btn--primary btn--full btn--forgot" type="submit">
          Enviar código
        </button>

      </form>

      <footer class="forgot-card__footer">
        <p class="forgot-card__back">
          Lembrou a senha?
          <a class="forgot-card__back-link" href="login.html">Voltar ao login</a>
        </p>
      </footer>

    </div>

  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/views/forgot-password.js"></script>
</body>
</html>
