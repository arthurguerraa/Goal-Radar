<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Radar — Nova Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/views/reset-password.css">
</head>
<body>

  <main class="reset-password-page">

    <div class="reset-password-card">

      <header class="reset-password-card__header">
        <a class="reset-password-card__logo" href="../index.html">Goal Radar</a>
        <div class="reset-password-card__icon">
          <i data-lucide="key-round"></i>
        </div>
        <h1 class="reset-password-card__title">Crie uma nova senha</h1>
        <p class="reset-password-card__subtitle">
          Sua nova senha deve ter no mínimo 8 caracteres.
        </p>
      </header>

      <form class="reset-password-form">

        <div class="reset-password-form__field">
          <label class="reset-password-form__label" for="password">
            Nova senha
          </label>
          <div class="reset-password-form__input-wrapper">
            <input
              class="reset-password-form__input"
              type="password"
              id="password"
              name="password"
              placeholder="mínimo 8 caracteres"
              minlength="8"
              autocomplete="new-password"
            />
            <button
              class="reset-password-form__toggle-password"
              type="button"
              aria-label="Mostrar senha"
            >
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <div class="reset-password-form__field">
          <label class="reset-password-form__label" for="password-confirm">
            Confirmar nova senha
          </label>
          <div class="reset-password-form__input-wrapper">
            <input
              class="reset-password-form__input"
              type="password"
              id="password-confirm"
              name="password-confirm"
              placeholder="repita sua senha"
              minlength="8"
              autocomplete="new-password"
            />
            <button
              class="reset-password-form__toggle-password"
              type="button"
              aria-label="Mostrar confirmação de senha"
            >
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <button class="btn btn--primary btn--full btn--reset-password" type="submit">
          Salvar nova senha
        </button>

      </form>

    </div>

  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/components/toggle-password.js"></script>
  <script src="../js/views/reset-password.js"></script>
</body>
</html>
