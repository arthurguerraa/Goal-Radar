<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Radar — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/views/login.css">
</head>

<body>

  <main class="login-page">

    <div class="login-card">

      <!-- Cabeçalho do card -->
      <header class="login-card__header">
        <a class="login-card__logo" href="../index.html">Goal Radar</a>
        <h1 class="login-card__title">Bem-vindo de volta</h1>
        <p class="login-card__subtitle">Entre na sua conta para continuar</p>
      </header>

      <!-- Formulário -->
      <form class="login-form">

        <div class="login-form__field">
          <label class="login-form__label" for="identifier">
            Email ou nome de usuário
          </label>
          <input class="login-form__input" type="text" id="identifier" name="identifier" placeholder="seu@email.com"
            autocomplete="username" />
        </div>

        <div class="login-form__field">
          <div class="login-form__label-row">
            <label class="login-form__label" for="password">Senha</label>
            <a class="login-form__forgot" href="forgot-password.html">
              Esqueci minha senha
            </a>
          </div>

          <!-- Adiciona um wrapper pra posicionar o ícone dentro do input -->
          <div class="login-form__input-wrapper">
            <input class="login-form__input" type="password" id="password" name="password" placeholder="••••••••"
              autocomplete="current-password" />
            <button class="login-form__toggle-password" type="button" aria-label="Mostrar senha">
              <i data-lucide="eye"></i>
            </button>
          </div>

          <button class="btn btn--primary btn--full login-form__submit" type="submit">
            Entrar
          </button>

      </form>

      <!-- Rodapé do card -->
      <footer class="login-card__footer">
        <p class="login-card__register">
          Não tem uma conta?
          <a class="login-card__register-link" href="register.html">Cadastre-se</a>
        </p>
      </footer>

    </div>

  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  <script src="../js/components/toggle-password.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script>
    // Se já estiver logado, vai pro dashboard
    if (AuthService.getToken()) {
      window.location.href = 'dashboard.html';
    }
  </script>
  <script src="../js/components/load-components.js"></script>
  <!-- restante dos scripts -->
  <script src="../js/views/login.js"></script>
</body>

</html>
